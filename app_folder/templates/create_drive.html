{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4>Create a Drive</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('create_drive') }}">
                    <div class="mb-3">
                        <label>Job Title / Drive Name</label>
                        <input type="text" name="job_title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Job Description</label>
                        <textarea name="job_description" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label>Eligibility Criteria</label>
                        <textarea name="eligibility_criteria" class="form-control" rows="2" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label>Application Deadline</label>
                        <input type="datetime-local" name="application_deadline" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success float-end">Save Drive</button>
                    <a href="{{ url_for('company_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
